name: Build iOS IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build BambuScan3D IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' BambuScan3D.xcodeproj/project.pbxproj || true
          sed -i '' 's/compatibilityVersion = "Xcode [0-9.]*"/compatibilityVersion = "Xcode 15.0"/g' BambuScan3D.xcodeproj/project.pbxproj || true

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project BambuScan3D.xcodeproj \
            -scheme BambuScan3D \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_STRICT_CONCURRENCY=minimal \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            BUILD_DIR=./build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/BambuScan3D.app build/Payload/
          
          # Sideloadly uyumluluğu için ad-hoc imzalama
          codesign --force --deep --sign - build/Payload/BambuScan3D.app
          
          cd build
          zip -qr ../BambuScan3D.ipa Payload
          cd ..
          
          echo "IPA Size:"
          ls -lh BambuScan3D.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuScan3D-IPA
          path: BambuScan3D.ipa
          retention-days: 30
